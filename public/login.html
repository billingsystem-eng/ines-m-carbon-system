<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — M-Carbon System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .signin { width: 100%; max-width: 380px; }
  .signin .panel { margin: 0; }
  .signin .mark { margin-bottom: 18px; }
  .signin .mark b { display: block; font-size: 1.35rem; letter-spacing: -0.02em; }
  .signin .mark span { color: var(--ink-soft); font-size: 0.88rem; }
</style>
</head>
<body>
<div class="signin">
  <div class="mark"><b>M-Carbon Billing System</b><span>Savings-based billing for INES Solutions</span></div>
  <div class="panel"><div class="body">
    <div id="error" class="notice bad" hidden></div>
    <form id="form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="primary" style="width:100%" type="submit">Sign in</button>
    </form>
  </div></div>
</div>
<script src="/js/app.js"></script>
<script>
const form = document.getElementById('form');
const error = document.getElementById('error');

form.onsubmit = async (e) => {
  e.preventDefault();
  error.hidden = true;
  try {
    await api('/api/auth/login', {
      method: 'POST',
      body: { username: username.value, password: password.value }
    });
    location.href = '/dashboard.html';
  } catch (err) {
    error.textContent = err.message;
    error.hidden = false;
  }
};

// Already signed in? Go straight through.
api('/api/auth/me').then(() => (location.href = '/dashboard.html')).catch(() => {});
</script>
</body>
</html>
