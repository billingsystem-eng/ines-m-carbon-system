<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billing worksheet — M-Carbon System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  #daily td { padding: 4px 8px; }
  #daily input { padding: 4px 6px; }
  #rate-lines td { padding: 5px 8px; }
  .locked { background: var(--amber-tint); }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head">
      <div>
        <div class="crumb"><a href="/bills.html">Billing</a></div>
        <h1 id="title">Billing worksheet</h1>
        <p id="sub"></p>
      </div>
      <div class="actions" id="actions"></div>
    </div>

    <div id="banner"></div>

    <div class="split">
      <div>
        <div class="panel">
          <header>
            <h2>Consumption and baseline</h2>
            <span id="source-tag" class="pill draft">Standalone / manual source</span>
          </header>
          <div class="body">
            <div class="actions no-print" style="margin-bottom:12px">
              <button type="button" id="pull-dashboard" data-edit>Pull from dashboard</button>
              <span id="synced-at" style="color:var(--ink-soft);font-size:.82rem;align-self:center"></span>
            </div>
            <div class="field">
              <label for="method">Baseline calculation method</label>
              <select id="method" data-edit>
                <option value="fixed">Method 1 — Dashboard fixed baseline</option>
                <option value="savings_pct">Method 2 — Agreed savings percentage</option>
                <option value="operating_hours">Method 3 — Actual operating hours per day</option>
              </select>
            </div>

            <div class="grid2">
              <div class="field" id="wrap-baseline">
                <label for="dashboard_daily_baseline">Dashboard average daily baseline (kWh/day)</label>
                <input id="dashboard_daily_baseline" type="number" step="0.0001" data-edit>
              </div>
              <div class="field" id="wrap-pct">
                <label for="agreed_savings_pct">Agreed savings percentage (%)</label>
                <input id="agreed_savings_pct" type="number" step="0.0001" data-edit>
              </div>
              <div class="field" id="wrap-actual">
                <label for="actual_kwh">Total actual M-Carbon consumption (kWh)</label>
                <input id="actual_kwh" type="number" step="0.001" data-edit>
              </div>
            </div>

            <div id="wrap-daily" hidden>
              <h3 style="margin-bottom:8px">Daily entries</h3>
              <div class="inline-form no-print" style="margin-bottom:10px">
                <div><label for="bulk-hours">Set operating hours for every day</label><input id="bulk-hours" type="number" step="0.25" data-edit></div>
                <div><button type="button" id="apply-hours" data-edit>Apply to all days</button></div>
              </div>
              <div class="table-wrap" style="max-height:340px;overflow-y:auto">
                <table id="daily">
                  <thead><tr><th>Date</th><th class="num">Actual consumption (kWh)</th><th class="num">Operating hours</th></tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <header>
            <h2>Electricity rates for this period</h2>
            <div class="actions no-print">
              <button type="button" id="load-rates" data-edit>Load project rates</button>
              <button type="button" id="single-rate" data-edit>Put all savings on one rate</button>
            </div>
          </header>
          <div class="table-wrap">
            <table id="rate-lines">
              <thead><tr><th>Rate label</th><th class="num">Rate (&#8369;/kWh)</th><th class="num">Energy savings (kWh)</th><th class="num">Savings value</th><th></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="body no-print"><button type="button" id="add-line" data-edit>Add rate line</button></div>
        </div>

        <div class="panel">
          <header><h2>Sharing ratio and balances</h2></header>
          <div class="body">
            <div class="grid2">
              <div class="field"><label for="ines_pct">INES share (%)</label><input id="ines_pct" type="number" step="0.01" data-edit></div>
              <div class="field"><label for="client_pct">Client share (%)</label><input id="client_pct" type="number" step="0.01" data-edit></div>
              <div class="field">
                <label for="previous_balance">Previous outstanding balance (&#8369;)</label>
                <input id="previous_balance" type="number" step="0.01" data-edit>
                <button type="button" class="quiet no-print" id="use-suggested" data-edit></button>
              </div>
              <div class="field"><label for="interest_charged">Late payment interest (&#8369;)</label><input id="interest_charged" type="number" step="0.01" data-edit></div>
              <div class="field"><label for="bill_date">Bill date</label><input id="bill_date" type="date" data-edit></div>
              <div class="field"><label for="due_date">Due date</label><input id="due_date" type="date" data-edit></div>
            </div>
            <div class="field"><label for="notes">Notes on this computation</label><textarea id="notes" data-edit></textarea></div>
          </div>
        </div>

        <div class="grid2">
          <div class="panel">
            <header><h2>Payments</h2></header>
            <div id="payments"></div>
            <div class="body no-print">
              <form id="pay-form" class="inline-form">
                <div><label for="pay-date">Date</label><input id="pay-date" type="date" required data-edit></div>
                <div><label for="pay-amount">Amount</label><input id="pay-amount" type="number" step="0.01" required data-edit></div>
                <div><label for="pay-ref">Reference</label><input id="pay-ref" data-edit></div>
                <div><button type="submit" data-edit>Record payment</button></div>
              </form>
            </div>
          </div>
          <div class="panel">
            <header><h2>Adjustments</h2></header>
            <div id="adjustments"></div>
            <div class="body no-print">
              <form id="adj-form" class="inline-form">
                <div><label for="adj-date">Date</label><input id="adj-date" type="date" required data-edit></div>
                <div><label for="adj-amount">Amount (negative for a credit)</label><input id="adj-amount" type="number" step="0.01" required data-edit></div>
                <div><label for="adj-reason">Reason</label><input id="adj-reason" required data-edit></div>
                <div><button type="submit" data-edit>Apply adjustment</button></div>
              </form>
            </div>
          </div>
        </div>

        <div class="panel">
          <header><h2>Change history</h2></header>
          <div class="table-wrap" id="trail"></div>
        </div>
      </div>

      <div>
        <div class="tape" id="tape"></div>
      </div>
    </div>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
let bill, me, lines = [], latest = null;

const g = (x) => document.getElementById(x);
const val = (x) => g(x).value;

function methodView() {
  const m = val('method');
  g('wrap-baseline').hidden = m === 'savings_pct';
  g('wrap-pct').hidden = m !== 'savings_pct';
  g('wrap-actual').hidden = m === 'operating_hours';
  g('wrap-daily').hidden = m !== 'operating_hours';
}

function collect() {
  const daily = [...document.querySelectorAll('#daily tbody tr')].map((tr) => ({
    day_date: tr.dataset.date,
    actual_kwh: tr.querySelector('.d-kwh').value,
    operating_hours: tr.querySelector('.d-hours').value
  }));
  return {
    baseline_method: val('method'),
    dashboard_daily_baseline: val('dashboard_daily_baseline'),
    agreed_savings_pct: val('agreed_savings_pct'),
    actual_kwh: val('actual_kwh'),
    daily,
    rate_lines: lines,
    ines_pct: val('ines_pct'),
    client_pct: val('client_pct'),
    previous_balance: val('previous_balance'),
    interest_charged: val('interest_charged'),
    bill_date: val('bill_date'),
    due_date: val('due_date'),
    notes: val('notes')
  };
}

function renderLines() {
  const body = document.querySelector('#rate-lines tbody');
  body.innerHTML = lines.length ? lines.map((l, i) => `<tr>
      <td><input class="l-label" value="${esc(l.label || '')}" data-edit></td>
      <td class="num"><input class="l-rate num" type="number" step="0.0001" value="${l.rate ?? ''}" data-edit></td>
      <td class="num"><input class="l-kwh num" type="number" step="0.001" value="${l.kwh ?? ''}" data-edit></td>
      <td class="num">${money((Number(l.rate) || 0) * (Number(l.kwh) || 0))}</td>
      <td class="num no-print"><button class="quiet danger" data-edit onclick="dropLine(${i})">Remove</button></td>
    </tr>`).join('')
    : '<tr><td colspan="5" class="empty">No rate lines yet. Load the project rates or add one.</td></tr>';

  body.querySelectorAll('input').forEach((input, n) => {
    input.oninput = () => {
      const row = Math.floor(n / 3), field = ['label', 'rate', 'kwh'][n % 3];
      lines[row][field] = input.value;
      preview();
    };
  });
  if (readOnly(me) || !bill.editable) disableEditing();
}

function dropLine(i) { lines.splice(i, 1); renderLines(); preview(); }

let timer;
function preview() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try {
      latest = await api(`/api/bills/${id}/preview`, { method: 'POST', body: collect() });
      renderTape(latest);
      document.querySelectorAll('#rate-lines tbody tr').forEach((tr, i) => {
        const cell = tr.querySelectorAll('td')[3];
        if (cell && lines[i]) cell.textContent = money((Number(lines[i].rate) || 0) * (Number(lines[i].kwh) || 0));
      });
    } catch (e) { /* keep the last good tape */ }
  }, 300);
}

function renderTape(r) {
  const warn = r.warnings.length
    ? `<div class="step"><div class="notice warn" style="margin:0"><b>Check before approving</b><ul>${r.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div></div>`
    : '';
  g('tape').innerHTML = `
    <header><h2>Calculation record</h2>
      <span style="color:var(--ink-soft);font-size:.82rem">${r.days} days in period</span></header>
    <div class="step"><h4>Step 1 — Baseline consumption</h4>
      ${r.baseline_working.map((w) => `<div class="line"><span>${esc(w.label)}</span><span>${esc(w.value)}</span></div>`).join('')}
    </div>
    <div class="step"><h4>Step 2 — Energy savings</h4>
      <div class="line"><span>Calculated baseline</span><span>${kwh(r.baseline_kwh)}</span></div>
      <div class="line"><span>Actual consumption</span><span>− ${kwh(r.actual_kwh)}</span></div>
      <div class="line total"><span>Energy savings</span><span>${kwh(r.energy_savings_kwh)}</span></div>
    </div>
    <div class="step"><h4>Step 3 — Gross energy cost savings</h4>
      ${r.rate_lines.length ? r.rate_lines.map((l) => `<div class="line"><span>${esc(l.label)} · ${kwh(l.kwh)} × ${money(l.rate)}</span><span>${money(l.value)}</span></div>`).join('')
        : '<div class="line"><span>No rate lines entered</span><span>—</span></div>'}
      <div class="line total"><span>Gross cost savings</span><span>${money(r.gross_savings)}</span></div>
    </div>
    <div class="step"><h4>Step 4 — Sharing</h4>
      <div class="line"><span>INES share ${dec(val('ines_pct'))}%</span><span>${money(r.amount_billed)}</span></div>
      <div class="line"><span>Client retained ${dec(val('client_pct'))}%</span><span>${money(r.client_retained)}</span></div>
    </div>
    <div class="step"><h4>Statement summary</h4>
      <div class="line"><span>Current amount due</span><span>${money(r.amount_billed)}</span></div>
      <div class="line"><span>Previous balance</span><span>${money(r.previous_balance)}</span></div>
      <div class="line"><span>Late payment interest</span><span>${money(r.interest_charged)}</span></div>
      <div class="line"><span>Adjustments</span><span>${money(r.adjustments_total)}</span></div>
      <div class="line"><span>Payments received</span><span>− ${money(r.payments_total)}</span></div>
    </div>
    ${warn}
    <div class="headline"><div class="line"><span>Total amount due</span><span>${money(r.total_due)}</span></div></div>`;
}

function renderActions() {
  const next = { draft: 'Send for review', for_review: 'Approve', approved: 'Mark as final', final: 'Issue to client' }[bill.status];
  const canVoid = me.role === 'admin' && ['draft', 'for_review', 'approved'].includes(bill.status);
  const parts = [];
  if (bill.editable && !readOnly(me)) parts.push('<button class="primary" id="save">Save and compute</button>');
  if (next && !readOnly(me)) parts.push(`<button id="advance">${next}</button>`);
  if (['final', 'issued'].includes(bill.status) && !readOnly(me)) parts.push('<button id="revise">Create revision</button>');
  parts.push(`<a class="btn" href="/statement.html?id=${bill.id}">View statement</a>`);
  if (canVoid) parts.push('<button class="danger" id="void">Void this bill</button>');
  g('actions').innerHTML = parts.join('');

  if (g('save')) g('save').onclick = save;
  if (g('advance')) g('advance').onclick = advance;
  if (g('revise')) g('revise').onclick = revise;
  if (g('void')) g('void').onclick = voidBill;
}

async function voidBill() {
  const reason = prompt(`Void ${bill.statement_no}? This removes it from pending approval and billing lists — the record stays for the audit trail. Give a reason:`);
  if (reason === null) return;
  if (!reason.trim()) return toast('A reason is required to void a bill.', true);
  try {
    await api(`/api/bills/${id}/status`, { method: 'POST', body: { status: 'void', reason: reason.trim() } });
    toast('Bill voided');
    location.href = '/bills.html';
  } catch (e) { toast(e.message, true); }
}

async function save() {
  try {
    latest = await api('/api/bills/' + id, { method: 'PUT', body: collect() });
    toast('Computation saved');
    await load();
  } catch (e) { toast(e.message, true); }
}

async function advance() {
  try {
    const r = await api(`/api/bills/${id}/status`, { method: 'POST', body: {} });
    toast('Now ' + r.status_label.toLowerCase());
    await load();
  } catch (e) { toast(e.message, true); }
}

async function revise() {
  const reason = prompt('Why is this statement being revised?');
  if (!reason) return;
  try {
    const r = await api(`/api/bills/${id}/revise`, { method: 'POST', body: { reason } });
    location.href = '/bill.html?id=' + r.id;
  } catch (e) { toast(e.message, true); }
}

async function load() {
  bill = await api('/api/bills/' + id);
  document.title = bill.statement_no + ' — M-Carbon Billing System';
  g('title').textContent = bill.statement_no;
  g('sub').innerHTML = `${esc(bill.client.name)} · ${esc(bill.project.name)} · ${dateText(bill.period_start)} – ${dateText(bill.period_end)}
    &nbsp; <span class="pill ${bill.status}">${esc(bill.status_label)}</span>`;

  g('source-tag').textContent = bill.source === 'dashboard' ? 'M-Carbon Dashboard source' : 'Standalone / manual source';
  g('source-tag').className = 'pill ' + (bill.source === 'dashboard' ? 'approved' : 'draft');
  g('synced-at').textContent = bill.dashboard_synced_at ? `Last pulled ${bill.dashboard_synced_at}` : '';

  g('banner').innerHTML = bill.status === 'void'
    ? '<div class="notice bad">This billing period was voided. It won’t appear in pending approvals and doesn’t count toward billing totals. See the change history below for the reason.</div>'
    : !bill.editable
    ? `<div class="notice warn">This statement is ${esc(bill.status_label.toLowerCase())} and locked from editing. Create a revision if a correction is needed — the original stays on record.</div>`
    : (bill.revises_bill_id ? '<div class="notice good">This is a revision. The original statement remains on record.</div>' : '');

  const i = bill.inputs || {};
  const c = bill.contract;
  g('method').value = bill.baseline_method;
  g('dashboard_daily_baseline').value = i.dashboard_daily_baseline ?? c.dashboard_daily_baseline ?? '';
  g('agreed_savings_pct').value = i.agreed_savings_pct ?? c.agreed_savings_pct ?? '';
  g('actual_kwh').value = i.actual_kwh ?? bill.actual_kwh ?? '';
  g('ines_pct').value = bill.ines_pct ?? '';
  g('client_pct').value = bill.client_pct ?? '';
  g('previous_balance').value = bill.previous_balance ?? 0;
  g('interest_charged').value = bill.interest_charged ?? 0;
  g('bill_date').value = bill.bill_date || '';
  g('due_date').value = bill.due_date || '';
  g('notes').value = bill.notes || '';
  g('use-suggested').textContent = `Use calculated balance of ${money(bill.suggested_previous_balance)}`;
  g('use-suggested').onclick = () => { g('previous_balance').value = bill.suggested_previous_balance; preview(); };

  document.querySelector('#daily tbody').innerHTML = bill.daily.map((d) => `<tr data-date="${d.day_date}">
      <td>${dateText(d.day_date)}</td>
      <td class="num"><input class="d-kwh num" type="number" step="0.001" value="${d.actual_kwh ?? ''}" data-edit></td>
      <td class="num"><input class="d-hours num" type="number" step="0.25" min="0" max="24" value="${d.operating_hours ?? ''}" data-edit></td>
    </tr>`).join('');
  document.querySelectorAll('#daily input').forEach((el) => (el.oninput = preview));

  lines = (bill.rate_breakdown || []).length ? bill.rate_breakdown.map((l) => ({ ...l }))
    : (i.rate_lines || []).map((l) => ({ ...l }));
  renderLines();
  methodView();
  renderActions();

  g('payments').innerHTML = bill.payments.length ? `<div class="table-wrap"><table>
      <tbody>${bill.payments.map((p) => `<tr><td>${dateText(p.paid_on)}<br><span style="font-size:.82rem;color:var(--ink-soft)">${esc(p.reference || '')}</span></td>
        <td class="num">${money(p.amount)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No payments recorded.</div>';

  g('adjustments').innerHTML = bill.adjustments.length ? `<div class="table-wrap"><table>
      <tbody>${bill.adjustments.map((a) => `<tr><td>${dateText(a.adjusted_on)}<br><span style="font-size:.82rem;color:var(--ink-soft)">${esc(a.reason)}</span></td>
        <td class="num">${money(a.amount)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No adjustments applied.</div>';

  g('trail').innerHTML = bill.trail.length ? `<table>
      <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead>
      <tbody>${bill.trail.map((t) => `<tr><td>${esc(t.at)}</td><td>${esc(t.username || '')}</td>
        <td>${esc(t.action)}</td><td>${esc(t.detail || '')}</td></tr>`).join('')}</tbody></table>`
    : '<div class="empty">No changes recorded yet.</div>';

  if (readOnly(me) || !bill.editable) disableEditing();
  preview();
}

g('method').onchange = () => { methodView(); preview(); };
['dashboard_daily_baseline','agreed_savings_pct','actual_kwh','ines_pct','client_pct','previous_balance','interest_charged']
  .forEach((f) => (g(f).oninput = preview));

g('apply-hours').onclick = () => {
  const h = g('bulk-hours').value;
  document.querySelectorAll('#daily .d-hours').forEach((el) => (el.value = h));
  preview();
};

g('pull-dashboard').onclick = async () => {
  if (!bill.project.family_id) {
    return toast('This project isn\u2019t linked to the dashboard yet — link it from the project page first.', true);
  }
  try {
    const r = await api(`/api/bills/${id}/pull-dashboard`, { method: 'POST' });
    g('actual_kwh').value = r.actual_kwh;
    g('dashboard_daily_baseline').value = r.dashboard_daily_baseline;
    // Leave the baseline method as-is — pulling consumption shouldn't change
    // which method the billing officer already selected for this bill.
    r.daily.forEach((d) => {
      const row = document.querySelector(`#daily tr[data-date="${d.day_date}"]`);
      if (row) row.querySelector('.d-kwh').value = d.actual_kwh;
    });
    methodView();
    toast('Pulled from the M-Carbon Dashboard — review the baseline before saving.');
    preview();
  } catch (e) { toast(e.message, true); }
};

g('add-line').onclick = () => { lines.push({ label: '', rate: '', kwh: '' }); renderLines(); };

g('load-rates').onclick = () => {
  lines = (bill.contract.rates || []).map((r) => ({ label: r.label, rate: r.rate, kwh: '' }));
  if (!lines.length) return toast('This project has no rates configured yet.', true);
  renderLines(); preview();
};

g('single-rate').onclick = () => {
  const savings = latest?.energy_savings_kwh ?? 0;
  const first = bill.contract.rates?.[0];
  lines = [{ label: first?.label || 'Applicable rate', rate: first?.rate ?? '', kwh: savings }];
  renderLines(); preview();
};

g('pay-form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api(`/api/bills/${id}/payments`, { method: 'POST', body: {
      paid_on: g('pay-date').value, amount: g('pay-amount').value, reference: g('pay-ref').value
    }});
    e.target.reset(); await load(); toast('Payment recorded');
  } catch (err) { toast(err.message, true); }
};

g('adj-form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api(`/api/bills/${id}/adjustments`, { method: 'POST', body: {
      adjusted_on: g('adj-date').value, amount: g('adj-amount').value, reason: g('adj-reason').value
    }});
    e.target.reset(); await load(); toast('Adjustment applied');
  } catch (err) { toast(err.message, true); }
};

(async () => { me = await shell(); await load(); })().catch((e) => toast(e.message, true));
</script>
</body>
</html>
