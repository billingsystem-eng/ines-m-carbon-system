<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billing statement — M-Carbon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style> main { max-width: 900px; margin: 0 auto; } </style>
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head no-print">
      <div>
        <div class="crumb"><a href="/bills.html">Billing</a> / <a id="back" href="#">Worksheet</a></div>
        <h1>Billing statement</h1>
      </div>
      <div class="actions">
        <button class="primary" onclick="window.print()">Print or save as PDF</button>
      </div>
    </div>
    <div id="doc"></div>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');

const PROVIDER = {
  name: 'INES Solutions Inc.',
  address: 'Metro Manila, Philippines',
  tin: '—',
  phone: '—',
  email: '—'
};

const METHODS = {
  fixed: 'Method 1 — Dashboard fixed baseline',
  savings_pct: 'Method 2 — Agreed savings percentage',
  operating_hours: 'Method 3 — Actual operating hours per day'
};

const addr = (c) => [c.addr_unit, c.addr_building, c.addr_street, c.addr_barangay, c.addr_city, c.addr_region, c.addr_zip, c.addr_country]
  .filter(Boolean).join(', ');

(async () => {
  await shell();
  const b = await api('/api/bills/' + id);
  document.getElementById('back').href = '/bill.html?id=' + b.id;
  document.title = b.statement_no + ' — Billing statement';

  const primary = b.contacts.find((c) => c.is_primary) || b.contacts[0];
  const devices = b.devices.map((d) => d.device_no).join(', ') || '—';
  const rates = b.rate_breakdown || [];
  const prev = b.previous_bill;

  document.getElementById('doc').innerHTML = `
  <article class="statement">
    <div class="masthead">
      <div>
        <h1>${esc(PROVIDER.name)}</h1>
        <div style="font-size:.85rem">${esc(PROVIDER.address)}<br>TIN ${esc(PROVIDER.tin)} · ${esc(PROVIDER.phone)} · ${esc(PROVIDER.email)}</div>
      </div>
      <div class="no">
        <b>Statement of account</b><br>
        ${esc(b.statement_no)}<br>
        Statement date ${dateText(b.bill_date)}<br>
        <span class="pill ${b.status}">${esc(b.status_label)}</span>
      </div>
    </div>

    <section>
      <div class="grid2">
        <dl class="kv">
          <dt>Billed to</dt><dd><b>${esc(b.client.name)}</b></dd>
          <dt>Account no.</dt><dd>${esc(b.client.account_no)}</dd>
          <dt>TIN</dt><dd>${esc(b.client.tin || '—')}</dd>
          <dt>Address</dt><dd>${esc(addr(b.client) || '—')}</dd>
          <dt>Attention</dt><dd>${esc(primary ? primary.name + (primary.position ? ', ' + primary.position : '') : '—')}</dd>
        </dl>
        <dl class="kv">
          <dt>Project / site</dt><dd>${esc(b.project.name)}</dd>
          <dt>Meter / device no.</dt><dd>${esc(devices)}</dd>
          <dt>Data collection period</dt><dd>${dateText(b.period_start)} – ${dateText(b.period_end)} (${b.days} days)</dd>
          <dt>Bill date</dt><dd>${dateText(b.bill_date)}</dd>
          <dt>Due date</dt><dd>${dateText(b.due_date)}</dd>
          <dt>Data source</dt><dd>${b.source === 'manual' ? 'Standalone / manual source' : 'M-Carbon Dashboard'}</dd>
        </dl>
      </div>
    </section>

    <section>
      <h2 style="font-size:.95rem;margin-bottom:8px">Consumption and savings</h2>
      <table>
        <tbody>
          <tr><td>Baseline calculation method</td><td class="num">${esc(METHODS[b.baseline_method] || b.baseline_method)}</td></tr>
          <tr><td>Calculated baseline consumption</td><td class="num">${kwh(b.baseline_kwh)}</td></tr>
          <tr><td>Actual M-Carbon consumption</td><td class="num">${kwh(b.actual_kwh)}</td></tr>
          <tr><td><b>Energy savings</b></td><td class="num"><b>${kwh(b.energy_savings_kwh)}</b></td></tr>
        </tbody>
      </table>
    </section>

    <section>
      <h2 style="font-size:.95rem;margin-bottom:8px">Applicable rates</h2>
      <table>
        <thead><tr><th>Rate</th><th class="num">&#8369;/kWh</th><th class="num">Energy savings</th><th class="num">Savings value</th></tr></thead>
        <tbody>
          ${rates.length ? rates.map((r) => `<tr><td>${esc(r.label)}</td><td class="num">${dec(r.rate, 4)}</td>
            <td class="num">${kwh(r.kwh)}</td><td class="num">${money(r.value)}</td></tr>`).join('')
            : '<tr><td colspan="4">No rate breakdown recorded.</td></tr>'}
          <tr><td colspan="3"><b>Gross energy cost savings</b></td><td class="num"><b>${money(b.gross_savings)}</b></td></tr>
          <tr><td colspan="3">INES share (${dec(b.ines_pct)}%)</td><td class="num">${money(b.amount_billed)}</td></tr>
          <tr><td colspan="3">Client retained savings (${dec(b.client_pct)}%)</td><td class="num">${money(b.client_retained)}</td></tr>
        </tbody>
      </table>
    </section>

    <section>
      <h2 style="font-size:.95rem;margin-bottom:8px">Billing summary</h2>
      <table>
        <tbody>
          <tr><td>Current amount due (INES performance-based charge)</td><td class="num">${money(b.amount_billed)}</td></tr>
          <tr><td>Previous balance</td><td class="num">${money(b.previous_balance)}</td></tr>
          <tr><td>Late payment interest</td><td class="num">${money(b.interest_charged)}</td></tr>
          <tr><td>Adjustments</td><td class="num">${money(b.adjustments_total)}</td></tr>
          <tr><td>Payments and credits</td><td class="num">− ${money(b.payments_total)}</td></tr>
        </tbody>
      </table>
      <div class="due"><span>Total amount due by ${dateText(b.due_date)}</span><b>${money(b.total_due)}</b></div>
    </section>

    ${prev ? `<section>
      <h2 style="font-size:.95rem;margin-bottom:8px">Comparison with the previous period</h2>
      <table>
        <thead><tr><th>Period</th><th class="num">Actual consumption</th><th class="num">Energy savings</th><th class="num">Amount billed</th></tr></thead>
        <tbody>
          <tr><td>${dateText(prev.period_start)} – ${dateText(prev.period_end)}</td><td class="num">${kwh(prev.actual_kwh)}</td>
            <td class="num">${kwh(prev.energy_savings_kwh)}</td><td class="num">${money(prev.amount_billed)}</td></tr>
          <tr><td>${dateText(b.period_start)} – ${dateText(b.period_end)}</td><td class="num">${kwh(b.actual_kwh)}</td>
            <td class="num">${kwh(b.energy_savings_kwh)}</td><td class="num">${money(b.amount_billed)}</td></tr>
        </tbody>
      </table>
    </section>` : ''}

    <footer>
      Billing reference ${esc(b.statement_no)}. This statement is computed from the baseline method, inputs, rates and
      sharing ratio recorded for this billing period and remains traceable to them.
      ${b.source === 'manual' ? 'Consumption data for this period was entered manually (standalone mode).' : ''}
      ${b.notes ? '<br>Note: ' + esc(b.notes) : ''}
    </footer>
  </article>`;
})().catch((e) => toast(e.message, true));
</script>
</body>
</html>
