<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment method — M-Carbon System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  /* ---- Payment methods: card layout ---- */
  .pm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .pm-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .pm-card:hover { border-color: var(--rule-strong); box-shadow: 0 2px 10px rgba(21, 35, 34, 0.06); }
  .pm-card.inactive { background: #f7f8f6; }
  .pm-card.inactive .pm-badge { filter: grayscale(1); opacity: 0.55; }
  .pm-card.inactive .pm-name { color: var(--ink-soft); }
  .pm-top { display: flex; align-items: flex-start; gap: 12px; }
  .pm-badge {
    flex: none; width: 38px; height: 38px; border-radius: 8px;
    background: var(--signal-tint); color: var(--signal);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 1.05rem;
  }
  .pm-heading { flex: 1; min-width: 0; }
  .pm-name { font-weight: 600; letter-spacing: -0.01em; word-break: break-word; }
  .pm-status { margin-top: 3px; }
  .pm-details {
    white-space: pre-line; color: var(--ink-soft); font-size: 0.86rem;
    border-top: 1px dashed var(--rule); padding-top: 10px; line-height: 1.6;
  }
  .pm-details.empty-detail { font-style: italic; color: var(--rule-strong); }
  .pm-actions {
    margin-top: auto; padding-top: 6px; display: flex; gap: 4px; flex-wrap: wrap;
    border-top: 1px solid var(--rule);
  }
  .pm-actions button { flex: 1; text-align: center; }
  .pm-empty {
    grid-column: 1 / -1;
  }
  #form-panel header { background: var(--paper); }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head">
      <div><h1>Payment method</h1>
      <p>Active methods are printed under “Payment Methods” on every billing statement.</p></div>
    </div>

    <div id="list" class="pm-grid"></div>

    <div class="panel" id="form-panel" style="max-width:560px;margin-top:18px">
      <header><h2 id="form-title">Add a payment method</h2></header>
      <div class="body"><form id="pform">
        <div class="field"><label for="pm-name">Name</label>
          <input id="pm-name" required maxlength="120" placeholder="e.g. Bank transfer — BDO"></div>
        <div class="field"><label for="pm-details">Details</label>
          <textarea id="pm-details" maxlength="600" placeholder="Account name, account number, branch, payee, or instructions. Each line prints on its own line."></textarea></div>
        <div class="actions">
          <button class="primary" type="submit" id="pm-save">Add payment method</button>
          <button type="button" id="pm-cancel" hidden>Cancel</button>
        </div>
      </form></div>
    </div>
    <p id="ro-note" class="empty" hidden style="padding-top:0">Only administrators and billing officers can change payment methods.</p>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
let methods = [];
let editingId = null;
let canEdit = false;

const g = (id) => document.getElementById(id);

function initials(name) {
  const words = name.trim().split(/\s+/).filter(Boolean);
  if (!words.length) return '?';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

function render() {
  if (!methods.length) {
    g('list').innerHTML = '<div class="empty pm-empty">No payment methods yet. Until you add one, statements print a placeholder line.</div>';
    return;
  }
  g('list').innerHTML = methods.map((m) => `
    <div class="pm-card ${m.active ? '' : 'inactive'}">
      <div class="pm-top">
        <div class="pm-badge">${esc(initials(m.name))}</div>
        <div class="pm-heading">
          <div class="pm-name">${esc(m.name)}</div>
          <div class="pm-status"><span class="pill ${m.active ? 'issued' : 'void'}">${m.active ? 'Active' : 'Inactive'}</span></div>
        </div>
      </div>
      <div class="pm-details ${m.details ? '' : 'empty-detail'}">${m.details ? esc(m.details) : 'No details on file'}</div>
      ${canEdit ? `<div class="pm-actions">
        <button class="quiet" onclick="edit(${m.id})">Edit</button>
        <button class="quiet" onclick="toggle(${m.id}, ${m.active ? 0 : 1})">${m.active ? 'Deactivate' : 'Reactivate'}</button>
        <button class="quiet" style="color:var(--alert)" onclick="remove(${m.id})">Delete</button>
      </div>` : ''}
    </div>`).join('');
}

async function load() {
  methods = await api('/api/payment-methods');
  render();
}

function resetForm() {
  editingId = null;
  g('pform').reset();
  g('form-title').textContent = 'Add a payment method';
  g('pm-save').textContent = 'Add payment method';
  g('pm-cancel').hidden = true;
}

function edit(id) {
  const m = methods.find((x) => x.id === id);
  if (!m) return;
  editingId = id;
  g('pm-name').value = m.name;
  g('pm-details').value = m.details || '';
  g('form-title').textContent = 'Edit payment method';
  g('pm-save').textContent = 'Save changes';
  g('pm-cancel').hidden = false;
  g('pm-name').focus();
  g('form-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function toggle(id, active) {
  try { await api('/api/payment-methods/' + id, { method: 'PUT', body: { active } }); await load(); }
  catch (e) { toast(e.message, true); }
}

async function remove(id) {
  const m = methods.find((x) => x.id === id);
  if (!m || !confirm(`Delete “${m.name}”? It will no longer print on statements.`)) return;
  try {
    await api('/api/payment-methods/' + id, { method: 'DELETE' });
    if (editingId === id) resetForm();
    await load(); toast('Payment method deleted');
  } catch (e) { toast(e.message, true); }
}

g('pm-cancel').onclick = resetForm;

g('pform').onsubmit = async (e) => {
  e.preventDefault();
  const body = { name: g('pm-name').value.trim(), details: g('pm-details').value.trim() };
  try {
    if (editingId) await api('/api/payment-methods/' + editingId, { method: 'PUT', body });
    else await api('/api/payment-methods', { method: 'POST', body });
    toast(editingId ? 'Payment method updated' : 'Payment method added');
    resetForm(); await load();
  } catch (err) { toast(err.message, true); }
};

(async () => {
  const me = await shell();
  canEdit = me.role === 'admin' || me.role === 'billing_officer';
  if (!canEdit) { g('form-panel').hidden = true; g('ro-note').hidden = false; }
  await load();
})().catch((e) => toast(e.message, true));
</script>
</body>
</html>
